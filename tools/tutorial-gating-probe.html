<!doctype html>
<meta charset="utf-8" />
<title>tutorial gating probe</title>
<style>body{font:13px ui-monospace,monospace;background:#111;color:#ddd;padding:16px}</style>
<div id="hud"></div>
<pre id="out">running…</pre>
<script type="module">
  const out = document.getElementById("out")
  const lines = []
  const log = (s) => { lines.push(s); out.textContent = lines.join("\n") }

  const { Tutorial } = await import("/src/ui/tutorial.ts")

  // Each Tutorial appends its own panel to #hud, so the hud is cleared per test
  // and every read is scoped to the one panel that is currently live.
  const hud = document.getElementById("hud")
  const newTutorial = (ctx) => { hud.innerHTML = ""; return new Tutorial(ctx) }
  const objective = () => hud.querySelector(".tut-text")?.textContent ?? "(none)"
  const fill = () => parseFloat(hud.querySelector(".tut-fill")?.style.width ?? "0")

  function makeState(zone) {
    return { mode: "walk", pos: { x: -1560, y: 3, z: -1560 }, mouseDelta: 0, down: {}, pressed: {}, mapOpen: false, zone }
  }
  function makeCtx(s) {
    return {
      mode: () => s.mode,
      pos: () => s.pos,
      mouseDelta: () => s.mouseDelta,
      down: (c) => !!s.down[c],
      pressed: (c) => !!s.pressed[c],
      mapOpen: () => s.mapOpen,
      teleport: () => {},
      message: () => {},
      zone: () => s.zone,
      goToZone: () => {}
    }
  }
  const ZONE = () => ({
    watching: true, gatesPassed: 0, sprintMeters: 0, hurdleCleared: false,
    insideCottage: false, cottageVisited: false, lapFraction: 0, bowlAir: 0, ringsFlown: 0
  })

  // Drive N seconds of frames. `move` advances the body; pressed/mouse are
  // edge-ish and cleared each frame, like the real input layer.
  function run(t, s, seconds, move) {
    const dt = 1 / 60
    for (let i = 0; i < Math.round(seconds / dt); i++) {
      if (move) move(s, dt)
      t.update(dt)
      s.pressed = {}
      s.mouseDelta = 0
    }
  }
  // Walk east at 9 m/s — well under traveled()'s 20 m teleport guard.
  const walk = (s) => { s.pos = { ...s.pos, x: s.pos.x + 0.15 } }

  // Advance past "get on your feet" (instant) and the mouse-look beat.
  function toGatesStep(t, s) {
    run(t, s, 1.2)
    for (let i = 0; i < 200 && !objective().includes("bunting"); i++) { s.mouseDelta = 40; run(t, s, 1 / 60) }
    run(t, s, 1.0)
  }

  const results = []
  const check = (name, pass, detail) => { results.push({ name, pass, detail }); log(`${pass ? "PASS" : "FAIL"}  ${name} — ${detail}`) }

  // ── A: field watching, player walks 60 m but passes no gates ──────────────
  {
    const s = makeState(ZONE())
    const t = newTutorial(makeCtx(s))
    t.start()
    toGatesStep(t, s)
    const at = objective()
    run(t, s, 7, walk) // ~63 m of walking, gatesPassed stays 0
    check("walking does NOT pass the gates step",
      objective() === at && objective().includes("bunting") && fill() < 100,
      `still on "${objective()}" at ${fill()}%`)
  }

  // ── B: field watching, gates actually walked ─────────────────────────────
  {
    const s = makeState(ZONE())
    const t = newTutorial(makeCtx(s))
    t.start()
    toGatesStep(t, s)
    s.zone.gatesPassed = 3
    run(t, s, 2)
    check("passing three real gates DOES complete the step",
      !objective().includes("bunting"),
      `advanced to "${objective()}"`)
  }

  // ── C: no field at all — the net must still arm, but only after grace ────
  {
    const s = makeState(null)
    const t = newTutorial(makeCtx(s))
    t.start()
    toGatesStep(t, s)
    const at = objective()
    run(t, s, 5, walk) // 45 m walked, still inside the 8 s grace
    const duringGrace = objective()
    run(t, s, 12, walk) // grace elapses, net arms, 26 m re-walked
    check("no field: nothing awarded during grace",
      duringGrace === at && duringGrace.includes("bunting"),
      `held "${duringGrace}" through 45 m`)
    check("no field: net arms and lets the player through",
      !objective().includes("bunting"),
      `advanced to "${objective()}"`)
  }

  // ── D: the instant-pass steps — one Space tap must not clear the hurdle ──
  {
    const s = makeState(ZONE())
    const t = newTutorial(makeCtx(s))
    t.start()
    toGatesStep(t, s)
    s.zone.gatesPassed = 3
    run(t, s, 2)
    s.zone.sprintMeters = 99
    run(t, s, 2)
    const at = objective()
    for (let i = 0; i < 10; i++) { s.pressed = { Space: true }; run(t, s, 1 / 60) }
    run(t, s, 1)
    check("tapping Space does NOT clear the hurdle",
      objective() === at && at.includes("hay bales"),
      `still on "${objective()}"`)
  }

  // ── E–H: the field itself ────────────────────────────────────────────────
  // TutorialZone only builds geometry and reads a height function, so a fake
  // map/physics/scene is enough to drive it without a GPU device.
  {
    const THREE = await import("three/webgpu")
    const { TutorialZone } = await import("/src/world/tutorialZone/index.ts")
    const L = await import("/src/world/tutorialZone/layout.ts")

    const GROUND = 3
    const fakeMap = { groundTop: () => GROUND, setGroundTopOverlay() {}, clearGroundTopOverlay() {} }
    let body = 1
    const fakePhysics = {
      world: { createBox: () => body++, setBodyTransform() {}, destroyBody() {} },
      addQuerySolid() {}, removeQuerySolid() {}
    }
    const hudSink = { message() {} }
    const makeZone = () => new TutorialZone(fakeMap, fakePhysics, new THREE.Scene())
    const at = (u, v, y, mode) => ({ position: { x: L.zoneWorldX(u), y, z: L.zoneWorldZ(v) }, mode })

    // Drive the oval; `dir` is +1 or −1 around the ellipse.
    function lapOnce(dir) {
      const z = makeZone()
      const step = 0.05
      for (let i = 0; i <= Math.ceil((Math.PI * 2) / step); i++) {
        const th = dir * i * step
        z.update(1 / 60, i / 60, at(L.TRACK.cu + L.TRACK.a * Math.cos(th), L.TRACK.cv + L.TRACK.b * Math.sin(th), GROUND, "drive"), hudSink)
      }
      const lap = z.progress.lapFraction
      z.dispose()
      return lap
    }
    const cw = lapOnce(1)
    const ccw = lapOnce(-1)
    check("a lap counts clockwise", cw >= 0.98, `lapFraction ${cw.toFixed(3)}`)
    check("a lap counts anticlockwise too", ccw >= 0.98, `lapFraction ${ccw.toFixed(3)}`)

    // Fly the ring course through each hoop's centre, in order.
    {
      const z = makeZone()
      let t = 0
      let prev = { u: L.FLIGHT_RINGS[0].u, v: L.FLIGHT_RINGS[0].v + 30, h: L.FLIGHT_RINGS[0].height }
      for (const r of L.FLIGHT_RINGS) {
        for (let i = 1; i <= 12; i++) {
          const k = i / 12
          z.update(1 / 60, (t += 1 / 60), at(prev.u + (r.u - prev.u) * k, prev.v + (r.v - prev.v) * k, GROUND + prev.h + (r.height - prev.h) * k, "bird"), hudSink)
        }
        prev = { u: r.u, v: r.v, h: r.height }
      }
      const flown = z.progress.ringsFlown
      z.dispose()
      check("flying each hoop's centre passes all six rings", flown === 6, `ringsFlown ${flown}/6`)
    }

    // Distances the checklist steers by must actually point somewhere.
    {
      const z = makeZone()
      z.update(1 / 60, 0, at(L.TRACK.cu, L.TRACK.cv, GROUND, "walk"), hudSink)
      z.update(1 / 60, 1 / 60, at(L.TRACK.cu + 0.1, L.TRACK.cv, GROUND, "walk"), hudSink)
      const far = z.progress
      z.update(1 / 60, 2 / 60, at(L.BOWL.cu, L.BOWL.cv, GROUND, "board"), hudSink)
      const near = z.progress
      z.dispose()
      check("toBowl shrinks as you cross the field",
        far.toBowl > 90 && near.toBowl < 1,
        `${far.toBowl.toFixed(0)} m at the oval → ${near.toBowl.toFixed(1)} m at the bowl`)
    }
  }

  // ── I: the run ends on a congratulations card, not an empty screen ───────
  {
    const s = makeState(ZONE())
    const t = newTutorial(makeCtx(s))
    t.start()
    const skip = hud.querySelector(".tut-skip")
    for (let i = 0; i < 40 && hud.querySelector(".tut-ch")?.textContent?.includes("✓") !== true; i++) {
      skip.click()
      run(t, s, 1 / 60)
    }
    const chapter = hud.querySelector(".tut-ch")?.textContent ?? ""
    check("the tutorial ends on a visible congratulations",
      chapter.includes("Congratulations") && hud.querySelector(".tut-text").textContent.includes("teleport") &&
        getComputedStyle(hud.querySelector(".tutorial-panel")).display !== "none",
      `panel still up, reading "${chapter}"`)
  }

  window.__RESULT = { pass: results.every((r) => r.pass), results }
  log("")
  log(window.__RESULT.pass ? "ALL PASS" : "FAILURES PRESENT")
</script>
